[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "microfluidic-oil-segmentation"
version = "1.0.0"
description = "Six-class residual-oil segmentation with Attention ResUNet and desktop analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.3,<3", "torchvision>=0.18,<1", "numpy>=1.24,<3", "Pillow>=10,<13"]

[project.optional-dependencies]
desktop = ["PyQt5>=5.15,<6", "matplotlib>=3.7,<4"]
analysis = ["matplotlib>=3.7,<4"]
dev = ["pytest>=7,<10"]

[project.scripts]
oilseg = "oilseg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
